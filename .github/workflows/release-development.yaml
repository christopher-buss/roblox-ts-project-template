name: Release Develop

on:
  push:
    branches:
      - develop
    paths:
      - "src/**/*"
      - default.project.json
      - mantle.yaml
      - package.json
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: development_environment
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5

      - uses: jdx/mise-action@5ac50f778e26fac95da98d50503682459e86d566 # v3.2

      - name: Install dependencies
        uses: ./.github/actions/install-dependencies

      - name: Compile
        run: pnpm exec rbxtsc --verbose

      - name: Build project
        run: rojo build ./default.project.json --output place.rbxlx

      - name: Upload place
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          if-no-files-found: error
          name: place
          path: place.rbxlx

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment: development
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5

      - uses: jdx/mise-action@5ac50f778e26fac95da98d50503682459e86d566 # v3.2

      - name: Deploy to Roblox
        timeout-minutes: 15
        uses: ./.github/actions/deploy
        with:
          environment: development
          mantle-aws-access-key-id: ${{ secrets.MANTLE_AWS_ACCESS_KEY_ID }}
          mantle-aws-secret-access-key: ${{ secrets.MANTLE_AWS_SECRET_ACCESS_KEY }}
          mantle-open-cloud-api-key: ${{ secrets.MANTLE_OPEN_CLOUD_API_KEY }}
          roblosecurity: ${{ secrets.ROBLOSECURITY }}
          secret: ${{ secrets.WG_CONFIG_FILE }}
